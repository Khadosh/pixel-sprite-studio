name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Lint, test y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # El package.json de la raíz hace que Deno busque los npm: en node_modules; se desactiva explícitamente.
      - name: Type-check
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "== $f"; deno check --node-modules-dir=none --config "$(dirname "$f")/deno.json" "$f"
          done
      - name: Tests de _shared
        run: deno test --node-modules-dir=none supabase/functions/_shared/
